x-obscura-worker-build: &obscura-worker-build
  context: .
  dockerfile: experiments/obscura/Dockerfile

services:
  browser-search:
    image: actualhuman/rbs-obscura-lab-app:candidate
    environment:
      OBSCURA_ENABLED: "true"
      OBSCURA_URL: http://obscura:9222
    networks:
      camofox-control:
      crawl4ai-control:
      searxng-control:
      obscura-control:
      internet:

  egress-proxy:
    networks:
      camofox-control:
      crawl4ai-control:
      obscura-control:
      internet:

  obscura:
    build: *obscura-worker-build
    image: actualhuman/rbs-obscura-lab-obscura:candidate
    init: true
    restart: unless-stopped
    command:
      - --proxy
      - http://egress-proxy:3128
      - --stealth
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "9222"
      - --workers
      - "1"
    environment:
      HOME: /tmp
      OBSCURA_NAV_TIMEOUT_MS: "45000"
      OBSCURA_SCRIPT_DEADLINE_MS: "45000"
      OBSCURA_CDP_COMMAND_TIMEOUT_MS: "60000"
      OBSCURA_TIMEZONE: America/Los_Angeles
      OBSCURA_ALLOW_PRIVATE_NETWORK: "1"
    user: "65532:65532"
    working_dir: /tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    depends_on:
      egress-proxy:
        condition: service_healthy
    networks:
      obscura-control:

  egress-canary:
    networks:
      obscura-control:

networks:
  obscura-control:
    driver: bridge
    internal: true
