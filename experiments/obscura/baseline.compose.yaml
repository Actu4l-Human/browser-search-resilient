services:
  browser-search:
    image: actualhuman/rbs-obscura-lab-app:baseline

  egress-proxy:
    image: actualhuman/rbs-obscura-lab-app:baseline

  searxng:
    image: actualhuman/rbs-obscura-lab-searxng:baseline

  crawl4ai:
    image: actualhuman/rbs-obscura-lab-crawl4ai:baseline

  camofox:
    image: actualhuman/rbs-obscura-lab-camofox:baseline

  egress-canary:
    image: node:26-bookworm-slim
    command: ["node", "/opt/canary.mjs"]
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    environment:
      CANARY_PORT: 18080
    volumes:
      - ./experiments/obscura/canary.mjs:/opt/canary.mjs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:18080/counts').then(async (r) => { if (!r.ok) process.exit(1); await r.json(); process.exit(0); }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      - camofox-control
      - crawl4ai-control
