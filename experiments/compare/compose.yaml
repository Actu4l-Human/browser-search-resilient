{
  "name": "browser-search-compare",
  "x-profile-backends": {
    "baseline": ["direct", "crawl4ai", "camofox", "cloakbrowser"],
    "add-obscura": ["direct", "crawl4ai", "obscura", "camofox", "cloakbrowser"],
    "add-scrapling": ["direct", "crawl4ai", "scrapling", "camofox", "cloakbrowser"],
    "replace-obscura": ["direct", "crawl4ai", "obscura"],
    "replace-scrapling": ["direct", "crawl4ai", "scrapling"]
  },
  "services": {
    "browser-search": {
      "build": {
        "context": "../..",
        "dockerfile": "Dockerfile"
      },
      "image": "actualhuman/resilient-browser-search:compare",
      "restart": "unless-stopped",
      "init": true,
      "stop_grace_period": "30s",
      "depends_on": {
        "searxng": {
          "condition": "service_healthy"
        },
        "crawl4ai": {
          "condition": "service_started"
        },
        "camofox": {
          "condition": "service_healthy"
        },
        "obscura": {
          "condition": "service_started"
        },
        "scrapling": {
          "condition": "service_healthy"
        },
        "egress-proxy": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "HOST": "0.0.0.0",
        "PORT": "8088",
        "ALLOWED_HOSTS": "localhost,127.0.0.1,browser-search",
        "ALLOWED_ORIGINS": "localhost,127.0.0.1",
        "BROWSER_SEARCH_API_KEY": "${BROWSER_SEARCH_API_KEY:-}",
        "SEARXNG_URL": "http://searxng:8080",
        "CAMOFOX_URL": "http://camofox:9377",
        "OBSCURA_URL": "http://obscura:9222",
        "SCRAPLING_URL": "http://scrapling:11236",
        "SCRAPLING_TOKEN": "${SCRAPLING_TOKEN:-}",
        "CRAWL4AI_ENABLED": "${CRAWL4AI_ENABLED:-true}",
        "CRAWL4AI_URL": "http://crawl4ai:11235",
        "CRAWL4AI_TOKEN": "${CRAWL4AI_TOKEN:-}",
        "CRAWL4AI_TIMEOUT_MS": "${CRAWL4AI_TIMEOUT_MS:-20000}",
        "CRAWL4AI_PAGE_TIMEOUT_MS": "${CRAWL4AI_PAGE_TIMEOUT_MS:-20000}",
        "EGRESS_PROXY_URL": "http://egress-proxy:3128",
        "CAMOFOX_API_KEY": "${CAMOFOX_API_KEY:-}",
        "CAMOFOX_ENABLED": "${CAMOFOX_ENABLED:-true}",
        "OBSCURA_ENABLED": "${OBSCURA_ENABLED:-false}",
        "SCRAPLING_ENABLED": "${SCRAPLING_ENABLED:-false}",
        "FETCH_STACK_PROFILE": "${FETCH_STACK_PROFILE:-baseline}",
        "CLOAK_ENABLED": "${CLOAK_ENABLED:-true}",
        "CLOAKBROWSER_LICENSE_KEY": "${CLOAKBROWSER_LICENSE_KEY:-}",
        "CLOAK_PROXY": "${CLOAK_PROXY:-http://egress-proxy:3128}",
        "CLOAK_GEOIP": "${CLOAK_GEOIP:-false}",
        "CLOAK_HEADLESS": "${CLOAK_HEADLESS:-false}",
        "CLOAK_HUMANIZE": "${CLOAK_HUMANIZE:-true}",
        "CLOAK_TIMEZONE": "${CLOAK_TIMEZONE:-America/Los_Angeles}",
        "CLOAK_LOCALE": "${CLOAK_LOCALE:-en-US}",
        "DIRECT_TIMEOUT_MS": "${DIRECT_TIMEOUT_MS:-5000}",
        "BROWSER_TIMEOUT_MS": "${BROWSER_TIMEOUT_MS:-20000}",
        "BROWSER_SETTLE_MS": "${BROWSER_SETTLE_MS:-0}",
        "CHALLENGE_WAIT_MS": "${CHALLENGE_WAIT_MS:-5000}",
        "BROWSER_CONCURRENCY": "${BROWSER_CONCURRENCY:-2}",
        "RESEARCH_CONCURRENCY": "${RESEARCH_CONCURRENCY:-4}",
        "MAX_RESPONSE_BYTES": "${MAX_RESPONSE_BYTES:-5000000}",
        "RATE_LIMIT_RPM": "${RATE_LIMIT_RPM:-0}",
        "RATE_LIMIT_BURST": "${RATE_LIMIT_BURST:-0}",
        "CACHE_ENABLED": "${CACHE_ENABLED:-false}",
        "CACHE_TTL_MS": "${CACHE_TTL_MS:-60000}",
        "ROBOTS_ENABLED": "${ROBOTS_ENABLED:-false}"
      },
      "ports": [
        "127.0.0.1:${BROWSER_SEARCH_PORT:-8088}:8088"
      ],
      "volumes": [
        "cloak-cache:/home/browser/.cloakbrowser",
        "browser-profiles:/data/profiles"
      ],
      "shm_size": "1gb",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 512,
      "mem_limit": "4g",
      "cpus": 4,
      "networks": {
        "camofox-control": {},
        "crawl4ai-control": {},
        "obscura-control": {},
        "scrapling-control": {},
        "searxng-control": {},
        "canary-control": {},
        "internet": {}
      }
    },
    "egress-proxy": {
      "build": {
        "context": "../..",
        "dockerfile": "Dockerfile"
      },
      "image": "actualhuman/resilient-browser-search:compare",
      "command": ["node", "dist/egress-proxy.js"],
      "restart": "unless-stopped",
      "init": true,
      "environment": {
        "EGRESS_PROXY_HOST": "0.0.0.0",
        "EGRESS_PROXY_PORT": 3128
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "curl -fsS http://127.0.0.1:3128/healthz >/dev/null || exit 1"],
        "interval": "15s",
        "timeout": "5s",
        "retries": 5,
        "start_period": "5s"
      },
      "read_only": true,
      "tmpfs": ["/tmp:size=32m,noexec,nosuid,nodev"],
      "security_opt": ["no-new-privileges:true"],
      "pids_limit": 128,
      "mem_limit": "256m",
      "cpus": 1,
      "networks": {
        "camofox-control": {},
        "crawl4ai-control": {},
        "obscura-control": {},
        "scrapling-control": {},
        "canary-control": {},
        "internet": {}
      }
    },
    "searxng": {
      "build": {
        "context": "../..",
        "dockerfile": "Dockerfile.searxng"
      },
      "image": "actualhuman/browser-search-searxng:compare",
      "restart": "unless-stopped",
      "environment": {
        "SEARXNG_BASE_URL": "http://searxng:8080/"
      },
      "volumes": [
        "../../config/searxng/settings.yml:/etc/searxng/settings.yml:ro",
        "searxng-cache:/var/cache/searxng"
      ],
      "healthcheck": {
        "test": ["CMD-SHELL", "wget --header='X-Forwarded-For: 127.0.0.1' --header='X-Real-IP: 127.0.0.1' -qO- 'http://127.0.0.1:8080/' >/dev/null || exit 1"],
        "interval": "15s",
        "timeout": "5s",
        "retries": 10,
        "start_period": "20s"
      },
      "security_opt": ["no-new-privileges:true"],
      "networks": {
        "searxng-control": {},
        "internet": {}
      }
    },
    "crawl4ai": {
      "build": {
        "context": "../..",
        "dockerfile": "Dockerfile.crawl4ai"
      },
      "image": "actualhuman/browser-search-crawl4ai:compare",
      "restart": "unless-stopped",
      "depends_on": {
        "egress-proxy": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "CRAWL4AI_TOKEN": "${CRAWL4AI_TOKEN:-}",
        "CRAWL4AI_PROXY": "http://egress-proxy:3128",
        "CRAWL4AI_USER_AGENT": "${WEB_USER_AGENT:-Mozilla/5.0 (compatible; ResilientBrowserSearch/0.2; +https://github.com/actual-human)}",
        "CRAWL4AI_PAGE_TIMEOUT_MS": "${CRAWL4AI_PAGE_TIMEOUT_MS:-20000}",
        "CRAWL4AI_TIMEOUT_MS": "${CRAWL4AI_TIMEOUT_MS:-20000}",
        "CRAWL4AI_BROWSER_SETTLE_MS": "${BROWSER_SETTLE_MS:-0}",
        "CRAWL4AI_MAX_SCROLL_STEPS": "${CRAWL4AI_MAX_SCROLL_STEPS:-3}",
        "CRAWL4AI_SCAN_FULL_PAGE": "${CRAWL4AI_SCAN_FULL_PAGE:-false}"
      },
      "shm_size": "1gb",
      "healthcheck": {
        "test": ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/healthz', timeout=3).read()\""],
        "interval": "15s",
        "timeout": "5s",
        "retries": 10,
        "start_period": "45s"
      },
      "security_opt": ["no-new-privileges:true"],
      "pids_limit": 256,
      "mem_limit": "2g",
      "cpus": 2,
      "networks": {
        "crawl4ai-control": {}
      }
    },
    "camofox": {
      "build": {
        "context": "../..",
        "dockerfile": "Dockerfile.camofox",
        "args": {
          "CAMOFOX_VERSION": "1.14.0"
        }
      },
      "image": "actualhuman/camofox-browser:1.14.0-compare",
      "restart": "unless-stopped",
      "depends_on": {
        "egress-proxy": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "CAMOFOX_API_KEY": "${CAMOFOX_API_KEY:-}",
        "CAMOFOX_CRASH_REPORT_ENABLED": "false",
        "CAMOFOX_HOST": "0.0.0.0",
        "CAMOFOX_PORT": 9377,
        "PROXY_STRATEGY": "round_robin",
        "PROXY_HOST": "egress-proxy",
        "PROXY_PORT": 3128
      },
      "volumes": ["camofox-data:/root/.camofox"],
      "shm_size": "1gb",
      "healthcheck": {
        "test": ["CMD-SHELL", "curl -fsS http://127.0.0.1:9377/health >/dev/null || exit 1"],
        "interval": "15s",
        "timeout": "5s",
        "retries": 10,
        "start_period": "45s"
      },
      "security_opt": ["no-new-privileges:true"],
      "pids_limit": 256,
      "mem_limit": "2g",
      "cpus": 2,
      "networks": {
        "camofox-control": {}
      }
    },
    "obscura": {
      "build": {
        "context": "../obscura",
        "dockerfile": "Dockerfile"
      },
      "image": "actualhuman/rbs-obscura-lab-obscura:compare",
      "init": true,
      "restart": "unless-stopped",
      "command": [
        "--proxy",
        "http://egress-proxy:3128",
        "--stealth",
        "serve",
        "--host",
        "0.0.0.0",
        "--port",
        "9222",
        "--workers",
        "1"
      ],
      "environment": {
        "HOME": "/tmp",
        "OBSCURA_NAV_TIMEOUT_MS": "${OBSCURA_NAV_TIMEOUT_MS:-20000}",
        "OBSCURA_SCRIPT_DEADLINE_MS": "${OBSCURA_SCRIPT_DEADLINE_MS:-20000}",
        "OBSCURA_CDP_COMMAND_TIMEOUT_MS": "${OBSCURA_CDP_COMMAND_TIMEOUT_MS:-60000}",
        "OBSCURA_TIMEZONE": "America/Los_Angeles",
        "OBSCURA_LOCALE": "en-US",
        "OBSCURA_ALLOW_PRIVATE_NETWORK": "1"
      },
      "user": "65532:65532",
      "working_dir": "/tmp",
      "read_only": true,
      "tmpfs": ["/tmp:size=64m,noexec,nosuid,nodev", "/dev/shm:size=256m,noexec,nosuid,nodev"],
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "pids_limit": 256,
      "mem_limit": "2g",
      "cpus": 2,
      "depends_on": {
        "egress-proxy": {
          "condition": "service_healthy"
        }
      },
      "networks": {
        "obscura-control": {}
      }
    },
    "scrapling": {
      "build": {
        "context": "../..",
        "dockerfile": "Dockerfile.scrapling"
      },
      "image": "actualhuman/rbs-scrapling-lab:compare",
      "init": true,
      "restart": "unless-stopped",
      "command": ["python", "-m", "uvicorn", "--app-dir", "/opt/resilient-scrapling", "app:app", "--host", "0.0.0.0", "--port", "11236"],
      "environment": {
        "HOME": "/tmp",
        "SCRAPLING_TOKEN": "${SCRAPLING_TOKEN:-}",
        "SCRAPLING_PROXY": "http://egress-proxy:3128",
        "BROWSER_TIMEOUT_MS": "${BROWSER_TIMEOUT_MS:-20000}",
        "BROWSER_SETTLE_MS": "${BROWSER_SETTLE_MS:-0}",
        "SCRAPLING_TIMEOUT_MS": "${SCRAPLING_TIMEOUT_MS:-20000}",
        "SCRAPLING_SETTLE_MS": "${BROWSER_SETTLE_MS:-0}",
        "SCRAPLING_LOCALE": "en-US",
        "SCRAPLING_TIMEZONE_ID": "America/Los_Angeles",
        "SCRAPLING_NETWORK_IDLE": "true",
        "SCRAPLING_WAIT_MS": "0"
      },
      "user": "10001:10001",
      "working_dir": "/tmp",
      "read_only": true,
      "tmpfs": ["/tmp:size=64m,noexec,nosuid,nodev", "/dev/shm:size=256m,noexec,nosuid,nodev"],
      "cap_drop": ["ALL"],
      "healthcheck": {
        "test": ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:11236/healthz', timeout=3).read()\""],
        "interval": "15s",
        "timeout": "5s",
        "retries": 10,
        "start_period": "45s"
      },
      "security_opt": ["no-new-privileges:true"],
      "pids_limit": 256,
      "mem_limit": "2g",
      "cpus": 2,
      "depends_on": {
        "egress-proxy": {
          "condition": "service_healthy"
        }
      },
      "networks": {
        "scrapling-control": {}
      }
    },
    "egress-canary": {
      "image": "node:26-bookworm-slim",
      "command": ["node", "/opt/canary.mjs"],
      "user": "65532:65532",
      "read_only": true,
      "cap_drop": ["ALL"],
      "tmpfs": ["/tmp:size=32m,noexec,nosuid,nodev"],
      "volumes": ["../../experiments/obscura/canary.mjs:/opt/canary.mjs:ro"],
      "healthcheck": {
        "test": ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""],
        "interval": "10s",
        "timeout": "3s",
        "retries": 10,
        "start_period": "3s"
      },
      "networks": {
        "canary-control": {}
      }
    }
  },
  "networks": {
    "camofox-control": {
      "driver": "bridge",
      "internal": true
    },
    "searxng-control": {
      "driver": "bridge",
      "internal": true
    },
    "crawl4ai-control": {
      "driver": "bridge",
      "internal": true
    },
    "obscura-control": {
      "driver": "bridge",
      "internal": true
    },
    "scrapling-control": {
      "driver": "bridge",
      "internal": true
    },
    "canary-control": {
      "driver": "bridge",
      "internal": true
    },
    "internet": {
      "driver": "bridge"
    }
  },
  "volumes": {
    "browser-profiles": {},
    "cloak-cache": {},
    "camofox-data": {},
    "searxng-cache": {}
  }
}
